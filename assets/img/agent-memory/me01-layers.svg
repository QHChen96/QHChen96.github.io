<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-labelledby="title desc">
<title id='title'>六个抽屉，各有自己的证据</title><desc id='desc'>历史、工作状态、检查点工件、长期记忆与权威系统分别按需进入当前上下文，职责不同。</desc>
<defs>
<pattern id='grid' width='24' height='24' patternUnits='userSpaceOnUse'><circle cx='2' cy='2' r='1' fill='#d9e5ea'/></pattern>
<filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='3' stdDeviation='4' flood-color='#15374b' flood-opacity='.08'/></filter>
<marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='context-stroke'/></marker>
</defs>
<rect width='600' height='850' rx='20' fill='#f6fafb'/>
<rect width='600' height='850' rx='20' fill='url(#grid)' opacity='.6'/>
<rect x='24' y='24' width='6' height='48' rx='3' fill='#0c7668'/>
<text x='45' y='46' text-anchor='start' font-size='28' fill='#19364b' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>六个抽屉，各有自己的证据</text>
<text x='45' y='77' text-anchor='start' font-size='20' fill='#5b7281' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>架构图 · 当前上下文按任务组合</text>
<rect x='100' y='115' width='400' height='80' rx='13' fill='white' stroke='#6452a3' stroke-width='2.4' filter='url(#shadow)'/>
<text x='300.0' y='148.5' text-anchor='middle' font-size='24' fill='#6452a3' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>当前上下文</text>
<text x='300.0' y='177.5' text-anchor='middle' font-size='24' fill='#19364b' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>这一轮要看什么</text>
<rect x='45' y='270' width='400' height='75' rx='13' fill='white' stroke='#0c7668' stroke-width='2.4' filter='url(#shadow)'/>
<text x='245.0' y='301.0' text-anchor='middle' font-size='24' fill='#0c7668' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>会话历史</text>
<text x='245.0' y='330.0' text-anchor='middle' font-size='24' fill='#19364b' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>实际说过什么</text>
<path d='M445 307.5 H530' fill='none' stroke='#0c7668' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'  />
<rect x='45' y='365' width='400' height='75' rx='13' fill='white' stroke='#0c7668' stroke-width='2.4' filter='url(#shadow)'/>
<text x='245.0' y='396.0' text-anchor='middle' font-size='24' fill='#0c7668' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>工作状态</text>
<text x='245.0' y='425.0' text-anchor='middle' font-size='24' fill='#19364b' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>当前办到哪一步</text>
<path d='M445 402.5 H530' fill='none' stroke='#0c7668' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'  />
<rect x='45' y='460' width='400' height='75' rx='13' fill='white' stroke='#0c7668' stroke-width='2.4' filter='url(#shadow)'/>
<text x='245.0' y='491.0' text-anchor='middle' font-size='24' fill='#0c7668' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>检查点与工件</text>
<text x='245.0' y='520.0' text-anchor='middle' font-size='24' fill='#19364b' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>运行位置与资料版本</text>
<path d='M445 497.5 H530' fill='none' stroke='#0c7668' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'  />
<rect x='45' y='555' width='400' height='75' rx='13' fill='white' stroke='#0c7668' stroke-width='2.4' filter='url(#shadow)'/>
<text x='245.0' y='586.0' text-anchor='middle' font-size='24' fill='#0c7668' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>长期记忆</text>
<text x='245.0' y='615.0' text-anchor='middle' font-size='24' fill='#19364b' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>未来仍适用的偏好与经验</text>
<path d='M445 592.5 H530' fill='none' stroke='#0c7668' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'  />
<rect x='45' y='650' width='400' height='75' rx='13' fill='white' stroke='#aa5625' stroke-width='2.4' filter='url(#shadow)'/>
<text x='245.0' y='681.0' text-anchor='middle' font-size='24' fill='#aa5625' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>权威业务系统</text>
<text x='245.0' y='710.0' text-anchor='middle' font-size='24' fill='#19364b' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>当前合同·批准·工单</text>
<path d='M445 687.5 H530' fill='none' stroke='#0c7668' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'  />
<path d='M530 687.5 V155 H503' fill='none' stroke='#0c7668' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'  marker-end="url(#arrow)"/>
<text x='300' y='777' text-anchor='middle' font-size='23' fill='#19364b' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>说过 ≠ 办过；记过 ≠ 现在有效</text>
<text x='300' y='815' text-anchor='middle' font-size='23' fill='#0c7668' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>来源与版本一起进入当前任务</text>
</svg>
