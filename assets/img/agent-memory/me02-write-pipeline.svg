<rect x='80' y='785' width='290' height='55' rx='13' fill='white' stroke='#6452a3' stroke-width='2.4' filter='url(#shadow)'/>
<text x='225.0' y='820.5' text-anchor='middle' font-size='24' fill='#6452a3' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>按版本发布索引</text>
