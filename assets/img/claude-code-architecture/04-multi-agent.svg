<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1970" viewBox="0 0 600 1970" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">分工时，复制了什么、共享什么</title>
<desc id="desc">子代理部分：主会话用 Agent 工具委派任务，普通子代理有新上下文和委派提示；Fork 子代理复制启动时父上下文，后续过程独立，最终报告返回主会话。文件默认可能共用 checkout，可用 isolation: worktree 分离工作目录。Skill 的 context: fork 不复制父对话。Teams 部分：启用后 lead 发起独立 teammates，成员不继承 lead 对话，通过 mailbox 互通；Task 工具可用时可维护共享任务表，否则用消息协调。Teams 是实验性功能，仅交互使用且默认关闭，-p 和 Agent SDK 不启动 teammates。上下文隔离不等于权限或文件隔离。</desc>
<metadata>Original code-generated SVG for the Claude Code tutorial. Public-mechanism teaching diagram; documentation snapshot 2.1.314, 2026-10-31. Generator: tools/generate-claude-code-diagrams.py.</metadata>
