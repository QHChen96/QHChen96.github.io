<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1360" viewBox="0 0 600 1360" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">扩展能力分别加在什么位置</title>
<desc id="desc">CLAUDE.md 与 rules 是进入上下文的工作约定。Skill 在调用时加载任务方法与配套材料；Hooks 由运行时事件触发处理器，程序检查和 LLM 判断不同。MCP 配置连接外部服务并发现工具，工具经宿主权限处理后在真实环境执行，业务权限仍由服务端控制。Plugin 可以打包这些组件，组件也可独立配置；它不是一次额外模型推理。settings.json 配置宿主行为和权限，提示上下文不替代执行约束。</desc>
