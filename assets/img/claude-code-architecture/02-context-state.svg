<title id="title">上下文、记忆与文件各管什么</title>
<desc id="desc">适用项目指令与跨会话自动记忆按规则进入当前上下文，相关工作区片段通过搜索读取进入。压缩把旧历史变成摘要，可能损失细节；会话记录用于恢复有效历史。工作区另由有限的文件检查点和 Git 管理。恢复对话不恢复进程，检查点不回滚远端 API 或数据库，对话分支也不等于 Git 分支或 worktree。</desc>
