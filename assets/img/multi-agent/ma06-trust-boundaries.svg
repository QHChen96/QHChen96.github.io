<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-labelledby="title desc">
<title id='title'>资料不能替人授予权限</title><desc id='desc'>外部资料作为数据进入研究；证据校验后只生成内部草稿；工具访问逐次授权，发送必须有具体版本的业务批准。</desc>
<defs>
<pattern id='grid' width='24' height='24' patternUnits='userSpaceOnUse'><circle cx='2' cy='2' r='1' fill='#d9e5ea'/></pattern>
<filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='3' stdDeviation='4' flood-color='#15374b' flood-opacity='.08'/></filter>
<marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='context-stroke'/></marker>
</defs>
<rect width='600' height='850' rx='20' fill='#f6fafb'/>
<rect width='600' height='850' rx='20' fill='url(#grid)' opacity='.6'/>
<rect x='24' y='24' width='6' height='48' rx='3' fill='#0c7668'/>
<text x='45' y='46' text-anchor='start' font-size='28' fill='#19364b' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>资料不能替人授予权限</text>
<text x='45' y='77' text-anchor='start' font-size='20' fill='#5b7281' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>信任边界图 · 读、写、发分别把关</text>
<rect x='25' y='110' width='550' height='150' rx='16' fill='white' fill-opacity='.65' stroke='#d7e8ec' stroke-dasharray='7 5' stroke-width='2'/>
<text x='41' y='140' text-anchor='start' font-size='22' fill='#57717d' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>资料区 · 内容可能不可信</text>
<rect x='50' y='163' width='225' height='70' rx='13' fill='white' stroke='#aa5625' stroke-width='2.4' filter='url(#shadow)'/>
<text x='162.5' y='206.0' text-anchor='middle' font-size='26' fill='#aa5625' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>网页 / 工单</text>
<rect x='325' y='163' width='225' height='70' rx='13' fill='white' stroke='#aa5625' stroke-width='2.4' filter='url(#shadow)'/>
<text x='437.5' y='206.0' text-anchor='middle' font-size='26' fill='#aa5625' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>合同 / 政策</text>
<path d='M162 233 V280 H300 V317' fill='none' stroke='#0c7668' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'  marker-end="url(#arrow)"/>
<path d='M437 233 V280 H300' fill='none' stroke='#0c7668' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'  />
<rect x='175' y='320' width='250' height='75' rx='13' fill='white' stroke='#0c7668' stroke-width='2.4' filter='url(#shadow)'/>
<text x='300.0' y='365.5' text-anchor='middle' font-size='26' fill='#0c7668' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>授权研究与证据校验</text>
<path d='M300 395 V452' fill='none' stroke='#0c7668' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'  marker-end="url(#arrow)"/>
<rect x='175' y='455' width='250' height='75' rx='13' fill='white' stroke='#6452a3' stroke-width='2.4' filter='url(#shadow)'/>
<text x='300.0' y='500.5' text-anchor='middle' font-size='26' fill='#6452a3' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>仅生成内部草稿</text>
<path d='M300 530 V587' fill='none' stroke='#0c7668' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'  marker-end="url(#arrow)"/>
<rect x='175' y='590' width='250' height='75' rx='13' fill='white' stroke='#aa5625' stroke-width='2.4' filter='url(#shadow)'/>
<text x='300.0' y='635.5' text-anchor='middle' font-size='26' fill='#aa5625' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>具体版本业务批准</text>
<path d='M300 665 V717' fill='none' stroke='#0c7668' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'  marker-end="url(#arrow)"/>
<rect x='175' y='720' width='250' height='75' rx='13' fill='white' stroke='#0c7668' stroke-width='2.4' filter='url(#shadow)'/>
<text x='300.0' y='765.5' text-anchor='middle' font-size='26' fill='#0c7668' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>受控发送与对账</text>
<path d='M50 197 H15 V745 H172' fill='none' stroke='#ae3e40' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round' stroke-dasharray="7 6" />
<text x='90' y='441' text-anchor='middle' font-size='22' fill='#ae3e40' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>越权捷径</text>
<path d='M70 465 L95 490 M95 465 L70 490' stroke='#ae3e40' stroke-width='5'/>
<text x='83' y='523' text-anchor='middle' font-size='24' fill='#ae3e40' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>拒绝</text>
</svg>