<svg xmlns="http://www.w3.org/2000/svg" width="600" height="830" viewBox="0 0 600 830" role="img" aria-labelledby="title desc">
<title id='title'>先验收，再进入草稿</title><desc id='desc'>三份信封先核对结构、身份、权限与来源，再保存证据，写作读取已核验结果，缺口返回具体任务。</desc>
<defs>
<pattern id='grid' width='24' height='24' patternUnits='userSpaceOnUse'><circle cx='2' cy='2' r='1' fill='#d9e5ea'/></pattern>
<filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='3' stdDeviation='4' flood-color='#15374b' flood-opacity='.08'/></filter>
<marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='context-stroke'/></marker>
</defs>
<rect width='600' height='830' rx='20' fill='#f6fafb'/>
<rect width='600' height='830' rx='20' fill='url(#grid)' opacity='.6'/>
<rect x='24' y='24' width='6' height='48' rx='3' fill='#0c7668'/>
<text x='45' y='46' text-anchor='start' font-size='28' fill='#19364b' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>先验收，再进入草稿</text>
<text x='45' y='77' text-anchor='start' font-size='20' fill='#5b7281' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>数据流 · 摘要不能直接覆盖事实</text>
<rect x='25' y='112' width='170' height='75' rx='13' fill='white' stroke='#0c7668' stroke-width='2.4' filter='url(#shadow)'/>
<text x='110.0' y='157.5' text-anchor='middle' font-size='26' fill='#0c7668' font-weight='700' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>客户信封</text>
