<path d='M145 695 H60 V302 H142' fill='none' stroke='#ae3e40' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round' stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x='69' y='475' text-anchor='middle' font-size='22' fill='#ae3e40' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>补项</text>
<text x='300' y='790' text-anchor='middle' font-size='23' fill='#19364b' font-weight='500' font-family='Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif'>工件引用展开时仍检查权限</text>
</svg>