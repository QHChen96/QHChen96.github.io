<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">客服 Agent 上线前，先拦住乱承诺</title>
  <desc id="desc">领导催着上线，小陈把未经核实的退款承诺挡在审核线外</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#e9f1ed"/>
      <stop offset="1" stop-color="#f7e8dc"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#314b48" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="740" fill="url(#bg)"/>
  <circle cx="1055" cy="110" r="175" fill="#d2e2d9" opacity=".8"/>
  <circle cx="165" cy="670" r="220" fill="#f5d8c4" opacity=".65"/>
  <rect x="68" y="62" width="1064" height="616" rx="36" fill="#fffdf9" filter="url(#shadow)"/>
  <rect x="122" y="114" width="206" height="45" rx="22" fill="#245b52"/>
  <text x="225" y="143" text-anchor="middle" fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">小陈的 Agent 工单</text>
  <text x="122" y="246" fill="#173c39" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="59" font-weight="800">明早上线客服 Agent？</text>
  <text x="122" y="328" fill="#173c39" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="59" font-weight="800">先拦住这句“已退款”</text>
  <text x="122" y="397" fill="#627771" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28">领导催上线 · 小陈用一张工单讲清边界</text>
  <rect x="122" y="470" width="425" height="116" rx="20" fill="#fff0e8" stroke="#e8ae90" stroke-width="3"/>
  <circle cx="162" cy="508" r="15" fill="#cf6e4f"/>
  <text x="191" y="518" fill="#a44d37" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700">AI：已为您安排退款</text>
  <text x="158" y="557" fill="#a44d37" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23">查都没查，话先说满</text>
  <path d="M583 528h93" stroke="#9db5aa" stroke-width="7" stroke-linecap="round"/>
  <path d="m656 505 28 23-28 23" fill="none" stroke="#9db5aa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="709" y="470" width="365" height="116" rx="20" fill="#eaf4ed" stroke="#8bb6a0" stroke-width="3"/>
  <circle cx="750" cy="509" r="16" fill="#2d8066"/>
  <path d="m742 509 6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="782" y="520" fill="#25664f" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">查证据，再交人工</text>
  <text x="748" y="557" fill="#427965" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22">能回答，才回答</text>
</svg>
