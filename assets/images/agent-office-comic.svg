<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">职场周报的三幕小剧场</title>
  <desc id="desc">第一幕，小陈交周报；第二幕，领导要求既精炼又详细；第三幕，Agent 核对原始记录，整理出有来源的草稿，等待人确认。</desc>
  <rect width="960" height="390" rx="24" fill="#f3f5f0"/>
  <text x="42" y="52" fill="#254d40" font-size="23" font-weight="700" font-family="system-ui, sans-serif">周报求生：一份稿子，三种命运</text>
  <g font-family="system-ui, sans-serif">
    <rect x="42" y="86" width="270" height="262" rx="18" fill="#fff" stroke="#d8e0d7" stroke-width="2"/>
    <text x="62" y="121" fill="#567568" font-size="15" font-weight="700">第一幕 · 交稿</text>
    <rect x="70" y="150" width="214" height="79" rx="13" fill="#eef2ec"/>
    <text x="87" y="182" fill="#273b31" font-size="18" font-weight="600">“本周进展见附件。”</text>
    <text x="87" y="207" fill="#65746a" font-size="13">小陈：这次总稳了吧。</text>
    <circle cx="108" cy="280" r="22" fill="#c8d8c9"/>
    <path d="M73 333 Q76 301 108 301 Q140 301 143 333" fill="#dcebe2" stroke="#9db9a7" stroke-width="2"/>
    <text x="160" y="293" fill="#65746a" font-size="13">已发送 v1.docx</text>

    <rect x="345" y="86" width="270" height="262" rx="18" fill="#fff" stroke="#d8e0d7" stroke-width="2"/>
    <text x="365" y="121" fill="#a36b3c" font-size="15" font-weight="700">第二幕 · 领导批注</text>
    <rect x="373" y="150" width="214" height="91" rx="13" fill="#fff0df"/>
    <text x="388" y="181" fill="#70451e" font-size="18" font-weight="600">“再精炼一点，</text>
    <text x="388" y="207" fill="#70451e" font-size="18" font-weight="600">细节也要更全。”</text>
    <text x="373" y="290" fill="#906644" font-size="15">小陈：好的，马上改。</text>
    <text x="373" y="317" fill="#906644" font-size="13">内心：这两句能同时成立吗？</text>

    <rect x="648" y="86" width="270" height="262" rx="18" fill="#fff" stroke="#d8e0d7" stroke-width="2"/>
    <text x="668" y="121" fill="#4e5f91" font-size="15" font-weight="700">第三幕 · Agent 搭把手</text>
    <rect x="676" y="150" width="214" height="91" rx="13" fill="#e9edf8"/>
    <text x="692" y="180" fill="#37466e" font-size="17" font-weight="600">先查记录，再做摘要。</text>
    <text x="692" y="207" fill="#37466e" font-size="17" font-weight="600">风险附依据，请你审核。</text>
    <text x="676" y="290" fill="#5f6a83" font-size="15">小陈：终于有据可改。</text>
    <text x="676" y="317" fill="#5f6a83" font-size="13">最终发送键，仍在你手里。</text>
  </g>
</svg>
