<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img">
<rect width="960" height="430" rx="22" fill="#f6f8f7"/>
<rect x="20" y="20" width="920" height="390" rx="18" fill="#fff" stroke="#dde7e3"/>
<rect x="39" y="39" width="7" height="41" rx="3" fill="#276b66"/>
<text x="60" y="68" text-anchor="start" fill="#203d3a" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700">MCP 接通 ≠ 退款获批</text>
<text x="60" y="98" text-anchor="start" fill="#667d77" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="500">协议连接、工单授权与高风险审批分开检查</text>
<rect x="45" y="145" width="225" height="145" rx="16" fill="#eef5f1" stroke="#b7d1c4" stroke-width="2"/>
<text x="63" y="182" text-anchor="start" fill="#234e45" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700">客服应用</text>
<text x="63" y="216" text-anchor="start" fill="#5c706a" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="500">只提供本单只读工具</text>
<text x="63" y="245" text-anchor="start" fill="#5c706a" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="500">管理模型与调用</text>
<rect x="355" y="145" width="225" height="145" rx="16" fill="#eef5f1" stroke="#b7d1c4" stroke-width="2"/>
<text x="373" y="182" text-anchor="start" fill="#234e45" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700">MCP 订单服务</text>
<text x="373" y="216" text-anchor="start" fill="#5c706a" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="500">列出工具并执行调用</text>
<text x="373" y="245" text-anchor="start" fill="#5c706a" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="500">返回查询结果</text>
<rect x="665" y="145" width="245" height="145" rx="16" fill="#eef5f1" stroke="#b7d1c4" stroke-width="2"/>
<text x="683" y="182" text-anchor="start" fill="#234e45" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700">业务权限闸口</text>
<text x="683" y="216" text-anchor="start" fill="#5c706a" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="500">核对工单与订单绑定</text>
<text x="683" y="245" text-anchor="start" fill="#5c706a" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="500">退款另走人工审批</text>
<path d="M280 220 H334" fill="none" stroke="#789c8b" stroke-width="4" stroke-linecap="round"/><path d="M330 212 L342 220 L330 228" fill="none" stroke="#789c8b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M590 220 H644" fill="none" stroke="#789c8b" stroke-width="4" stroke-linecap="round"/><path d="M640 212 L652 220 L640 228" fill="none" stroke="#789c8b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="250" y="323" width="460" height="48" rx="12" fill="#fff1e9" stroke="#edb69b" stroke-width="2"/>
<text x="480" y="354" text-anchor="middle" fill="#a45a3d" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">没有批准和业务回执，就没有“已退款”</text>
</svg>
