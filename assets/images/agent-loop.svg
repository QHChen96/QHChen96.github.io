<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">0823 工单的 Agent 决策路线</title>
  <desc id="desc">客户称订单已签收却没收到。Agent 只读查询订单，再查当前售后规则，发现需要人工核实，最终生成附依据的内部草稿并转给客服审核。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#416b5c" stroke-width="2"/></marker>
  </defs>
  <rect width="960" height="420" rx="24" fill="#f3f5f0"/>
  <text x="38" y="49" fill="#254d40" font-size="23" font-weight="700" font-family="system-ui, sans-serif">同一张工单，Agent 到底做了什么？</text>
  <text x="38" y="77" fill="#62756a" font-size="14" font-family="system-ui, sans-serif">它看上一步查到的结果，再决定下一步；遇到争议就把决定权交回给人。</text>
  <g font-family="system-ui, sans-serif">
    <rect x="38" y="111" width="194" height="204" rx="18" fill="#fff" stroke="#d8e0d7" stroke-width="2"/>
    <rect x="53" y="127" width="94" height="29" rx="14" fill="#f9e8d6"/>
    <text x="70" y="147" fill="#8a5526" font-size="13" font-weight="700">客户提问</text>
    <text x="55" y="192" fill="#273b31" font-size="17" font-weight="700">“显示已签收，</text>
    <text x="55" y="219" fill="#273b31" font-size="17" font-weight="700">可我没收到。”</text>
    <text x="55" y="274" fill="#6a766d" font-size="14">还问：今天能退吗？</text>

    <rect x="269" y="111" width="194" height="204" rx="18" fill="#fff" stroke="#d8e0d7" stroke-width="2"/>
    <rect x="284" y="127" width="109" height="29" rx="14" fill="#dcebe2"/>
    <text x="300" y="147" fill="#285746" font-size="13" font-weight="700">① 查订单</text>
    <text x="286" y="192" fill="#273b31" font-size="17" font-weight="700">物流：已签收</text>
    <text x="286" y="233" fill="#586d5f" font-size="14">只读查询</text>
    <text x="286" y="272" fill="#ad6634" font-size="14">与客户说法冲突</text>

    <rect x="500" y="111" width="194" height="204" rx="18" fill="#fff" stroke="#d8e0d7" stroke-width="2"/>
    <rect x="515" y="127" width="139" height="29" rx="14" fill="#dcebe2"/>
    <text x="531" y="147" fill="#285746" font-size="13" font-weight="700">② 按结果查规则</text>
    <text x="517" y="192" fill="#273b31" font-size="17" font-weight="700">签收争议</text>
    <text x="517" y="219" fill="#273b31" font-size="17" font-weight="700">先交人工核实</text>
    <text x="517" y="272" fill="#6a766d" font-size="14">旧版 FAQ 不作依据</text>

    <rect x="731" y="111" width="194" height="204" rx="18" fill="#e1eee6" stroke="#9bbba9" stroke-width="2"/>
    <rect x="746" y="127" width="93" height="29" rx="14" fill="#2b614d"/>
    <text x="764" y="147" fill="#fff" font-size="13" font-weight="700">③ 交付</text>
    <text x="748" y="192" fill="#254d40" font-size="17" font-weight="700">附依据的草稿</text>
    <text x="748" y="222" fill="#254d40" font-size="17" font-weight="700">＋ 转人工标记</text>
    <text x="748" y="272" fill="#526b5b" font-size="14">客服确认后发送</text>

    <path d="M234 213 H259 M465 213 H490 M696 213 H721" fill="none" stroke="#416b5c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M366 315 V323" fill="none" stroke="#416b5c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="38" y="328" width="887" height="77" rx="14" fill="#254d40"/>
    <text x="62" y="353" fill="#cce2d4" font-size="13" font-weight="700">查完订单，下一步不一样</text>
    <text x="62" y="379" fill="#fff" font-size="15" font-weight="600">未发货 → 查取消规则　｜　本单已签收、客户称未收到 → 查签收争议规则，转人工。</text>
  </g>
</svg>
