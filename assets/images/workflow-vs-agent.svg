<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">普通模型调用、工作流与 Agent 的区别</title>
  <desc id="desc">普通模型调用一次给出回答；工作流按事先确定的步骤运行；Agent 根据每一步结果动态选择下一步工具或动作。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#4a6d60" stroke-width="1.5"/></marker></defs>
  <rect width="960" height="400" rx="24" fill="#f3f5f0"/>
  <text x="44" y="53" fill="#254d40" font-size="22" font-weight="700" font-family="system-ui, sans-serif">同样用大模型，控制流程的方式不同</text>
  <g font-family="system-ui, sans-serif">
    <rect x="44" y="100" width="268" height="250" rx="19" fill="#fff" stroke="#d8e0d7" stroke-width="2"/>
    <text x="68" y="140" fill="#254d40" font-size="18" font-weight="700">普通模型调用</text>
    <text x="68" y="170" fill="#637268" font-size="14">一次输入，一次回答</text>
    <rect x="72" y="231" width="72" height="42" rx="10" fill="#edf3ec"/>
    <rect x="212" y="231" width="72" height="42" rx="10" fill="#edf3ec"/>
    <text x="94" y="258" fill="#254d40" font-size="14">提问</text><text x="234" y="258" fill="#254d40" font-size="14">回答</text>
    <path d="M150 252 H204" fill="none" stroke="#4a6d60" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="346" y="100" width="268" height="250" rx="19" fill="#fff" stroke="#d8e0d7" stroke-width="2"/>
    <text x="370" y="140" fill="#254d40" font-size="18" font-weight="700">工作流 Workflow</text>
    <text x="370" y="170" fill="#637268" font-size="14">步骤和分支预先设计</text>
    <rect x="371" y="231" width="60" height="42" rx="10" fill="#edf3ec"/>
    <rect x="450" y="231" width="60" height="42" rx="10" fill="#edf3ec"/>
    <rect x="529" y="231" width="60" height="42" rx="10" fill="#edf3ec"/>
    <text x="384" y="258" fill="#254d40" font-size="14">提取</text><text x="463" y="258" fill="#254d40" font-size="14">判断</text><text x="542" y="258" fill="#254d40" font-size="14">输出</text>
    <path d="M433 252 H443 M512 252 H522" fill="none" stroke="#4a6d60" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="648" y="100" width="268" height="250" rx="19" fill="#fff" stroke="#d8e0d7" stroke-width="2"/>
    <text x="672" y="140" fill="#254d40" font-size="18" font-weight="700">Agent</text>
    <text x="672" y="170" fill="#637268" font-size="14">根据结果动态选择下一步</text>
    <rect x="675" y="231" width="72" height="42" rx="10" fill="#dcebe2"/>
    <rect x="808" y="206" width="80" height="42" rx="10" fill="#edf3ec"/>
    <rect x="808" y="282" width="80" height="42" rx="10" fill="#edf3ec"/>
    <text x="696" y="258" fill="#254d40" font-size="14">决策</text><text x="828" y="233" fill="#254d40" font-size="14">搜索</text><text x="828" y="309" fill="#254d40" font-size="14">代码</text>
    <path d="M751 245 800 229 M751 262 800 299" fill="none" stroke="#4a6d60" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
