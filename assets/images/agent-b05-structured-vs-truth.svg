<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">结构化输出要过格式与事实两道门</title>
  <desc id="desc">虚构工单 0823 输出了合法 JSON，声称退款已完成。格式检查通过，但本轮没有匹配订单的退款系统成功回执，事实检查必须拦截，不能进入客服发送队列。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#416b5c" stroke-width="1.6"/></marker>
    <style>text { font-family: system-ui, "Microsoft YaHei", sans-serif; }</style>
  </defs>
  <rect width="960" height="420" rx="24" fill="#f3f5f0"/>
  <text x="38" y="49" font-size="23" font-weight="750" fill="#254d40">表格填得漂亮，退款也得拿得出回执</text>
  <rect x="38" y="83" width="234" height="228" rx="18" fill="#fff" stroke="#d8e0d7" stroke-width="2"/>
  <rect x="58" y="101" width="111" height="31" rx="15" fill="#edf3ec"/>
  <text x="77" y="123" font-size="16" font-weight="750" fill="#285746">模型输出</text>
  <text x="58" y="170" font-size="17" fill="#637268">订单：0823</text>
  <text x="58" y="209" font-size="17" fill="#637268">退款状态：</text>
  <text x="58" y="237" font-size="22" font-weight="750" fill="#8a4c2c">已完成</text>
  <text x="58" y="284" font-size="17" fill="#637268">JSON 字段齐全</text>
  <path d="M282 198H311" fill="none" stroke="#416b5c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="325" y="110" width="174" height="174" rx="18" fill="#e1eee6" stroke="#b6d0bf" stroke-width="2"/>
  <circle cx="412" cy="157" r="22" fill="#2b614d"/>
  <path d="M402 157L409 164L423 149" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="369" y="212" font-size="22" font-weight="750" fill="#254d40">格式门</text>
  <text x="354" y="245" font-size="17" fill="#526b5b">字段、枚举值合规</text>
  <path d="M509 198H538" fill="none" stroke="#416b5c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="552" y="110" width="174" height="174" rx="18" fill="#fff2e8" stroke="#e5c4a6" stroke-width="2"/>
  <circle cx="639" cy="157" r="22" fill="#a3542e"/>
  <path d="M630 148L648 166 M648 148L630 166" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <text x="596" y="212" font-size="22" font-weight="750" fill="#8a4c2c">事实门</text>
  <text x="574" y="245" font-size="17" fill="#69483b">没有退款成功回执</text>
  <path d="M736 198H765" fill="none" stroke="#a3542e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="779" y="110" width="143" height="174" rx="18" fill="#fff" stroke="#e5c4a6" stroke-width="2"/>
  <text x="808" y="161" font-size="21" font-weight="750" fill="#8a4c2c">拦截</text>
  <text x="800" y="204" font-size="17" fill="#69483b">不发客户</text>
  <text x="800" y="237" font-size="17" fill="#69483b">重新生成</text>
  <rect x="38" y="334" width="884" height="58" rx="14" fill="#254d40"/>
  <text x="63" y="370" font-size="19" font-weight="650" fill="#fff">“已完成”必须匹配订单 0823 的退款系统成功回执；没有就写“未知”。</text>
</svg>
