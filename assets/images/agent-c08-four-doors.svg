<text x="291" y="226" text-anchor="start" fill="#5c706a" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="500">生成内部草稿</text>
<path d="M484 227 H490" fill="none" stroke="#789c8b" stroke-width="4" stroke-linecap="round"/><path d="M486 219 L498 227 L486 235" fill="none" stroke="#789c8b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="504" y="155" width="209" height="142" rx="16" fill="#fff4e8" stroke="#bad0ca" stroke-width="2"/>
