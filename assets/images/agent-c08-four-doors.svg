<text x="522" y="226" text-anchor="start" fill="#5c706a" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="500">绑定内容与人</text>
<path d="M715 227 H721" fill="none" stroke="#789c8b" stroke-width="4" stroke-linecap="round"/><path d="M717 219 L729 227 L717 235" fill="none" stroke="#789c8b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
