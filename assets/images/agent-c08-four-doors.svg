<text x="60" y="226" text-anchor="start" fill="#5c706a" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="500">限当前工单</text>
<path d="M253 227 H259" fill="none" stroke="#789c8b" stroke-width="4" stroke-linecap="round"/><path d="M255 219 L267 227 L255 235" fill="none" stroke="#789c8b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="273" y="155" width="209" height="142" rx="16" fill="#edf3f7" stroke="#bad0ca" stroke-width="2"/>
