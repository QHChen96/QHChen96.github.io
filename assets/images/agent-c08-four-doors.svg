<text x="753" y="226" text-anchor="start" fill="#5c706a" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="500">核对业务回执</text>
<rect x="165" y="327" width="630" height="48" rx="12" fill="#f8f3ec" stroke="#dfcbaa" stroke-width="2"/>
<text x="480" y="358" text-anchor="middle" fill="#8a653b" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">订单状态或提议版本变了，旧批准就要失效</text>
